index.html

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Future Self</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f3f5fa;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 15px;background:#17243a}
h1{color:#69e0c0;margin:5px}
header p{color:#c5d0df}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:15px}
button,select{background:#263750;color:white;border:1px solid #49617c;padding:11px;border-radius:10px;cursor:pointer}
button.active{background:#087f70}
main{max-width:750px;margin:auto;padding:15px}
.card{background:#1b2940;padding:20px;border-radius:16px;margin:14px 0}
h2{color:#69e0c0}
input,textarea{width:100%;padding:13px;margin:8px 0;background:#101827;color:white;border:1px solid #49617c;border-radius:9px}
textarea{min-height:95px}
.action{background:#087f70;width:100%;margin-top:10px}
.result{white-space:pre-wrap;line-height:1.8;color:#d9e9e6}
footer{text-align:center;color:#91a0b4;padding:25px}
</style>
</head>
<body>
<header>
<h1>Future Self ✨</h1>
<p id="tagline">افهم نفسك. ابنِ مستقبلك.</p>
<select id="language" onchange="changeLanguage()">
<option value="ar">العربية</option>
<option value="es">Español</option>
<option value="fr">Français</option>
<option value="en">English</option>
</select>
</header>

<nav>
<button id="humanBtn" class="active" onclick="showSection('human')">🧠 الإنسان</button>
<button id="animalBtn" onclick="showSection('animal')">🐾 الحيوانات</button>
<button id="historyBtn" onclick="showSection('history')">📚 سجلاتي</button>
</nav>

<main>
<section id="human">
<div class="card">
<h2 id="humanTitle">اكتشف نفسك</h2>
<p id="humanDesc">ابدأ بفهم وضعك الحالي وأهدافك.</p>
<label id="moodLabel">كيف تشعر اليوم؟</label>
<input id="mood" placeholder="اكتب شعورك...">
<label id="goalLabel">ما هدفك في الحياة؟</label>
<textarea id="goal" placeholder="اكتب هدفك..."></textarea>
<label id="challengeLabel">ما أكبر تحدٍ تواجهه؟</label>
<textarea id="challenge" placeholder="اشرح التحدي..."></textarea>
<button class="action" onclick="saveHuman()" id="humanSave">احفظ سجلك</button>
<div id="humanResult" class="result"></div>
</div>
</section>

<section id="animal" hidden>
<div class="card">
<h2 id="animalTitle">افهم حيوانك</h2>
<p id="animalDesc">تابع سلوك حيوانك وتغيراته اليومية.</p>
<label id="typeLabel">نوع الحيوان</label>
<select id="animalType">
<option value="dog">🐕 كلب</option>
<option value="cat">🐈 قطة</option>
</select>
<label id="ageLabel">العمر</label>
<input id="animalAge" placeholder="العمر">
<label id="behaviorLabel">السلوك اليوم</label>
<textarea id="behavior" placeholder="هل لاحظت تغيراً في السلوك؟"></textarea>
<label id="healthLabel">ملاحظات عن الصحة والنشاط</label>
<textarea id="health" placeholder="الأكل، النوم، الحركة..."></textarea>
<button class="action" onclick="saveAnimal()" id="animalSave">احفظ المتابعة</button>
<div id="animalResult" class="result"></div>
</div>
</section>

<section id="history" hidden>
<div class="card">
<h2 id="historyTitle">سجلاتك السابقة</h2>
<div id="records"></div>
<button onclick="exportData()" id="exportBtn">تصدير بياناتي</button>
<button onclick="clearData()" id="clearBtn">حذف جميع السجلات</button>
</div>
</section>
</main>

<footer>Future Self © 2026 — Your journey starts today.</footer>

<script>
const translations={
ar:{
tag:"افهم نفسك. ابنِ مستقبلك.",human:"🧠 الإنسان",animal:"🐾 الحيوانات",history:"📚 سجلاتي",
ht:"اكتشف نفسك",hd:"ابدأ بفهم وضعك الحالي وأهدافك.",
ml:"كيف تشعر اليوم؟",gl:"ما هدفك في الحياة؟",cl:"ما أكبر تحدٍ تواجهه؟",
hs:"احفظ سجلك",at:"افهم حيوانك",ad:"تابع سلوك حيوانك وتغيراته اليومية.",
tl:"نوع الحيوان",al:"العمر",bl:"السلوك اليوم",hl:"ملاحظات عن الصحة والنشاط",
as:"احفظ المتابعة",his:"سجلاتك السابقة",ex:"تصدير بياناتي",del:"حذف جميع السجلات",
saved:"تم حفظ السجل بنجاح.",empty:"لا توجد سجلات بعد."
},
es:{
tag:"Compréndete. Construye tu futuro.",human:"🧠 Personas",animal:"🐾 Animales",history:"📚 Mis registros",
ht:"Descúbrete",hd:"Comprende tu situación y tus objetivos.",
ml:"¿Cómo te sientes hoy?",gl:"¿Cuál es tu objetivo?",cl:"¿Cuál es tu mayor desafío?",
hs:"Guardar registro",at:"Comprende a tu animal",ad:"Observa su comportamiento diario.",
tl:"Tipo de animal",al:"Edad",bl:"Comportamiento de hoy",hl:"Salud y actividad",
as:"Guardar seguimiento",his:"Registros anteriores",ex:"Exportar mis datos",del:"Eliminar todos los registros",
saved:"Registro guardado.",empty:"Todavía no hay registros."
},
fr:{
tag:"Comprends-toi. Construis ton avenir.",human:"🧠 Humain",animal:"🐾 Animaux",history:"📚 Mes données",
ht:"Découvre-toi",hd:"Comprends ta situation et tes objectifs.",
ml:"Comment te sens-tu aujourd'hui ?",gl:"Quel est ton objectif ?",cl:"Ton plus grand défi ?",
hs:"Enregistrer",at:"Comprendre ton animal",ad:"Observe son comportement quotidien.",
tl:"Type d'animal",al:"Âge",bl:"Comportement du jour",hl:"Santé et activité",
as:"Enregistrer le suivi",his:"Historique",ex:"Exporter mes données",del:"Tout supprimer",
saved:"Enregistrement réussi.",empty:"Aucun enregistrement."
},
en:{
tag:"Understand yourself. Build your future.",human:"🧠 Human",animal:"🐾 Animals",history:"📚 My records",
ht:"Discover yourself",hd:"Understand your current situation and goals.",
ml:"How do you feel today?",gl:"What is your life goal?",cl:"What is your biggest challenge?",
hs:"Save record",at:"Understand your animal",ad:"Track your animal's daily behavior.",
tl:"Animal type",al:"Age",bl:"Today's behavior",hl:"Health and activity notes",
as:"Save follow-up",his:"Previous records",ex:"Export my data",del:"Delete all records",
saved:"Record saved successfully.",empty:"No records yet."
}
};

let records=JSON.parse(localStorage.getItem("futureSelfRecords")||"[]");
let lang="ar";

function changeLanguage(){
lang=document.getElementById("language").value;
const t=translations[lang];
document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
const ids={
tagline:"tag",humanBtn:"human",animalBtn:"animal",historyBtn:"history",
humanTitle:"ht",humanDesc:"hd",moodLabel:"ml",goalLabel:"gl",
challengeLabel:"cl",humanSave:"hs",animalTitle:"at",animalDesc:"ad",
typeLabel:"tl",ageLabel:"al",behaviorLabel:"bl",healthLabel:"hl",
animalSave:"as",historyTitle:"his",exportBtn:"ex",clearBtn:"del"
};
for(const id in ids)document.getElementById(id).textContent=t[ids[id]];
document.getElementById("mood").placeholder=t.ml;
document.getElementById("goal").placeholder=t.gl;
document.getElementById("challenge").placeholder=t.cl;
document.getElementById("behavior").placeholder=t.bl;
document.getElementById("health").placeholder=t.hl;
renderRecords();
}

function showSection(section){
["human","animal","history"].forEach(s=>{
document.getElementById(s).hidden=s!==section;
document.getElementById(s+"Btn").classList.toggle("active",s===section);
});
if(section==="history")renderRecords();
}

function save(data){
records.unshift({date:new Date().toLocaleString(),...data});
localStorage.setItem("futureSelfRecords",JSON.stringify(records));
return true;
}

function saveHuman(){
save({
type:"human",
mood:document.getElementById("mood").value,
goal:document.getElementById("goal").value,
challenge:document.getElementById("challenge").value
});
document.getElementById("humanResult").textContent=translations[lang].saved;
}

function saveAnimal(){
save({
type:"animal",
animal:document.getElementById("animalType").value,
age:document.getElementById("animalAge").value,
behavior:document.getElementById("behavior").value,
health:document.getElementById("health").value
});
document.getElementById("animalResult").textContent=translations[lang].saved;
}

function renderRecords(){
const box=document.getElementById("records");
if(!records.length){box.textContent=translations[lang].empty;return;}
box.innerHTML="";
records.forEach(r=>{
const card=document.createElement("div");
card.className="card";
const title=document.createElement("strong");
title.textContent=(r.type==="human"?"🧠 ":"🐾 ")+r.date;
card.appendChild(title);
Object.entries(r).forEach(([key,value])=>{
if(key==="type"||key==="date")return;
const p=document.createElement("p");
p.textContent=key+": "+value;
card.appendChild(p);
});
box.appendChild(card);
});
}

function exportData(){
const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download="future-self-data.json";a.click();
URL.revokeObjectURL(url);
}

function clearData(){
if(confirm("هل تريد حذف جميع السجلات؟")){
records=[];
localStorage.removeItem("futureSelfRecords");
renderRecords();
}
}

changeLanguage();
</script>
</body>
</html>
